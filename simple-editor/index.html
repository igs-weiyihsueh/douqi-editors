<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡潔關卡編輯器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: white;
      overflow: hidden;
      margin: 0;
      display: flex;
    }
    
    /* 左方工具列 */
    .left-sidebar {
      width: 250px;
      background: #2d3748;
      border-right: 2px solid #4a5568;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      height: 60px;
      background: #1a202c;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #4a5568;
    }
    
    .sidebar-header h1 {
      font-size: 16px;
      font-weight: bold;
      color: #e2e8f0;
      margin: 0;
      text-align: center;
    }
    
    .sidebar-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    
    .sidebar-group {
      margin-bottom: 25px;
    }
    
    .sidebar-group h3 {
      font-size: 14px;
      color: #a0aec0;
      font-weight: 600;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid #4a5568;
    }
    
    .sidebar-button {
      width: 100%;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      transition: background-color 0.2s;
    }
    
    .sidebar-button:hover {
      background: #45a049;
    }
    
    .sidebar-button.secondary {
      background: #718096;
    }
    
    .sidebar-button.secondary:hover {
      background: #5a6375;
    }
    
    .main-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
    }
    
    .preview-container {
      background: #333;
      border: 2px solid #555;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    .canvas-wrapper {
      position: relative;
      background: #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      background: #2a2a2a;
    }
    
    .title {
      text-align: center;
      margin-bottom: 15px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }
    
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <!-- 左方工具列 -->
  <div class="left-sidebar">
    <div class="sidebar-header">
      <h1>鬥氣割草<br>關卡編輯器</h1>
    </div>
    
    <div class="sidebar-content">
      <div class="sidebar-group">
        <h3>關卡操作</h3>
        <button class="sidebar-button" onclick="clearLevel()">清除關卡</button>
      </div>
      
      <div class="sidebar-group">
        <h3>顯示設定</h3>
        <button class="sidebar-button secondary" onclick="toggleGrid()">切換網格</button>
        <button class="sidebar-button secondary" onclick="toggleBounds()">切換邊界</button>
      </div>
      
      <div class="sidebar-group">
        <h3>工具</h3>
        <button class="sidebar-button" onclick="validateCoordinates()">驗證座標對應</button>
      </div>
    </div>
  </div>

  <div class="main-area">
    <div class="preview-container">
      <div class="title">關卡預覽</div>
      
      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div class="info" id="info">
          載入中...
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/pixi.js@7.2.4/dist/pixi.min.js"></script>
  <script>
    // === 簡潔的全域變數 ===
    let app = null;
    let container = null;
    let entities = [];
    let showGrid = true;
    let showBounds = true;
    
    // === 遊戲場地設定 - 基於實際鬥氣割草配置 ===
    const GAME_WORLD_WIDTH = 1600;   // 實際遊戲世界寬度  
    const GAME_WORLD_HEIGHT = 1200;  // 實際遊戲世界高度
    const CANVAS_WIDTH = 960;        // Canvas顯示寬度 (16:9)
    const CANVAS_HEIGHT = 540;       // Canvas顯示高度 (16:9)
    
    // === 攝影機設定 ===
    let cameraX = 0;                 // 攝影機X位置
    let cameraY = 0;                 // 攝影機Y位置  
    let cameraZoom = 0.4;            // 攝影機縮放 (初始值讓整個場地可見)
    
    // === 初始化 PIXI ===
    function initEditor() {
      const canvas = document.getElementById('game-canvas');
      
      // 設定 Canvas 尺寸
      canvas.width = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;
      canvas.style.width = `${CANVAS_WIDTH}px`;
      canvas.style.height = `${CANVAS_HEIGHT}px`;
      
      // 創建 PIXI Application
      app = new PIXI.Application({
        view: canvas,
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT,
        backgroundColor: 0x2a2a2a,
        antialias: true
      });
      
      // 創建主容器
      container = new PIXI.Container();
      app.stage.addChild(container);
      
      // 設定初始攝影機位置和縮放
      container.x = CANVAS_WIDTH / 2;
      container.y = CANVAS_HEIGHT / 2;
      container.scale.set(cameraZoom);
      
      // 創建背景網格
      createGrid();
      
      // 創建關卡邊界
      createLevelBounds();
      
      // 更新資訊顯示
      updateInfo();
      
      // 設定滑鼠/觸控事件
      setupInput();
      
      console.log('簡潔編輯器初始化完成');
      console.log(`Canvas: ${CANVAS_WIDTH}x${CANVAS_HEIGHT}`);
      console.log(`遊戲世界: ${GAME_WORLD_WIDTH}x${GAME_WORLD_HEIGHT}`);
      console.log(`攝影機位置: (${cameraX}, ${cameraY})`);
      console.log(`攝影機縮放: ${cameraZoom}`);
    }
    
    // === 創建關卡邊界顯示 ===
    function createLevelBounds() {
      const boundsContainer = new PIXI.Container();
      const graphics = new PIXI.Graphics();
      
      // 繪製關卡邊界矩形
      graphics.lineStyle(4, 0xff6b6b, 0.8); // 紅色邊界線
      graphics.drawRect(
        -GAME_WORLD_WIDTH / 2, 
        -GAME_WORLD_HEIGHT / 2, 
        GAME_WORLD_WIDTH, 
        GAME_WORLD_HEIGHT
      );
      
      // 繪製角落標記 (更清楚邊界)
      const cornerSize = 40;
      graphics.lineStyle(6, 0xff6b6b, 1.0);
      
      // 左上角
      graphics.moveTo(-GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2 + cornerSize);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2 + cornerSize, -GAME_WORLD_HEIGHT / 2);
      
      // 右上角
      graphics.moveTo(GAME_WORLD_WIDTH / 2 - cornerSize, -GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2 + cornerSize);
      
      // 右下角
      graphics.moveTo(GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2 - cornerSize);
      graphics.lineTo(GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(GAME_WORLD_WIDTH / 2 - cornerSize, GAME_WORLD_HEIGHT / 2);
      
      // 左下角
      graphics.moveTo(-GAME_WORLD_WIDTH / 2 + cornerSize, GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2 - cornerSize);
      
      boundsContainer.addChild(graphics);
      container.addChild(boundsContainer);
      
      // 儲存邊界引用
      container.boundsContainer = boundsContainer;
      
      console.log(`關卡邊界: ${GAME_WORLD_WIDTH}x${GAME_WORLD_HEIGHT}`);
    }
    
    // === 創建背景網格 ===
    function createGrid() {
      const gridContainer = new PIXI.Container();
      const graphics = new PIXI.Graphics();
      
      // 網格設定
      const gridSize = 100;
      const gridColor = 0x444444;
      const centerColor = 0x666666;
      
      graphics.lineStyle(1, gridColor, 0.3);
      
      // 繪製網格線
      for (let x = -1000; x <= 1000; x += gridSize) {
        graphics.moveTo(x, -1000);
        graphics.lineTo(x, 1000);
      }
      
      for (let y = -1000; y <= 1000; y += gridSize) {
        graphics.moveTo(-1000, y);
        graphics.lineTo(1000, y);
      }
      
      // 繪製中心十字線
      graphics.lineStyle(2, centerColor, 0.6);
      graphics.moveTo(-50, 0);
      graphics.lineTo(50, 0);
      graphics.moveTo(0, -50);
      graphics.lineTo(0, 50);
      
      gridContainer.addChild(graphics);
      container.addChild(gridContainer);
      
      // 儲存網格引用
      container.gridContainer = gridContainer;
    }
    
    // === 清除關卡 ===
    function clearLevel() {
      // 移除所有實體
      entities.forEach(entity => {
        container.removeChild(entity);
      });
      entities = [];
      
      updateInfo();
      console.log('關卡已清除');
    }
    
    // === 切換網格顯示 ===
    function toggleGrid() {
      showGrid = !showGrid;
      if (container.gridContainer) {
        container.gridContainer.visible = showGrid;
      }
      updateInfo();
    }
    
    // === 切換邊界顯示 ===
    function toggleBounds() {
      showBounds = !showBounds;
      if (container.boundsContainer) {
        container.boundsContainer.visible = showBounds;
      }
      updateInfo();
    }
    
    // === 座標驗證 ===
    function validateCoordinates() {
      console.log('=== 座標系統驗證報告 ===');
      
      // 1. 遊戲世界基本資訊
      console.log('🌍 遊戲世界資訊:');
      console.log(`  - 實際遊戲世界: ${GAME_WORLD_WIDTH}×${GAME_WORLD_HEIGHT}像素`);
      console.log('  - 來源: LevelGameScene.ts setBounds()');
      console.log('  - 座標系統: 原點(0,0)位於左上角，右X+，下Y+');
      
      // 2. test_level.json 3D→2D映射
      console.log('📄 test_level.json 3D→2D映射:');
      console.log('  - JSON使用3D座標 [x, y, z]，y為高度軸');
      console.log('  - 🔥 實際遊戲轉換: gameX = json[0] * 50 + 400, gameY = json[2] * 50 + 300');
      console.log('  - 📐 編輯器轉換: editorX = json[0] * 50, editorY = json[2] * 50 (以中心為原點)');
      console.log('  - 縮放係數: 50像素/單位 (不是100!)');
      
      const mappingExamples = [
        { json: '[3, 0, 3]', game: '(550, 450)', editor: '(150, 150)', desc: 'enemy_001' },
        { json: '[1, 1, 1]', game: '(450, 350)', editor: '(50, 50)', desc: 'collectible_001' },
        { json: '[-1, 1, -1]', game: '(350, 250)', editor: '(-50, -50)', desc: 'powerup_001' },
        { json: '[0, 0, 0]', game: '(400, 300)', editor: '(0, 0)', desc: '原點參考' }
      ];
      
      mappingExamples.forEach(example => {
        console.log(`  - ${example.json} → 遊戲${example.game} → 編輯器${example.editor} (${example.desc})`);
      });
      
      // 3. 編輯器顯示設定
      console.log('🖼️ 編輯器顯示:');
      console.log(`  - Canvas尺寸: ${CANVAS_WIDTH}×${CANVAS_HEIGHT}像素 (16:9比例)`);
      console.log(`  - 座標系統: 原點(0,0)位於中心，右X+，下Y+`);
      console.log(`  - 當前攝影機: 位置(${cameraX}, ${cameraY}), 縮放${cameraZoom}x`);
      
      // 4. 攝影機與座標轉換
      console.log('🎥 攝影機座標轉換:');
      console.log(`  - 螢幕中心: (${CANVAS_WIDTH/2}, ${CANVAS_HEIGHT/2})`);
      console.log(`  - 容器位置: (${container.x.toFixed(0)}, ${container.y.toFixed(0)})`);
      console.log(`  - 容器縮放: ${container.scale.x.toFixed(2)}x`);
      
      // 5. 座標系統對應關係
      console.log('🔄 座標系統對應關係:');
      console.log('  - 遊戲座標系: 原點(0,0)位於左上角，右X+，下Y+');
      console.log('  - 編輯器座標系: 原點(0,0)位於中心，右X+，下Y+');
      console.log('  - 轉換公式: 編輯器(x,y) = 遊戲(x-800, y-600)');
      console.log('  - 實體映射: JSON[x,y,z] * 50 → 編輯器座標');
      console.log('  - ✅ 方向一致: 兩座標系都是右X+，下Y+');
      console.log('  - ✅ 縮放一致: 1遊戲像素 = 1編輯器像素');
      
      // 6. 邊界對應驗證
      console.log('🎯 邊界對應驗證:');
      console.log('  - 遊戲setBounds: (0,0) 到 (1600,1200)');
      console.log('  - 編輯器邊界: (-800,-600) 到 (800,600)');
      console.log('  - ✅ 完全對應: 編輯器紅邊框 = 實際遊戲邊界');
      
      console.log('=== 座標驗證完成 ===');
    }
    
    // === 更新資訊顯示 ===
    function updateInfo() {
      const info = document.getElementById('info');
      info.innerHTML = `
        實體數量: ${entities.length}<br>
        網格: ${showGrid ? '顯示' : '隱藏'}<br>
        邊界: ${showBounds ? '顯示' : '隱藏'}
      `;
    }
    
    // === 攝影機變換更新 ===
    function updateCameraTransform() {
      container.x = CANVAS_WIDTH / 2 - cameraX * cameraZoom;
      container.y = CANVAS_HEIGHT / 2 - cameraY * cameraZoom;
      container.scale.set(cameraZoom);
    }
    
    // === 設定輸入控制 ===
    function setupInput() {
      const canvas = document.getElementById('game-canvas');
      
      let isPanning = false;
      let lastPointerX = 0;
      let lastPointerY = 0;
      
      // 滑鼠/觸控按下
      canvas.addEventListener('pointerdown', (e) => {
        isPanning = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        canvas.style.cursor = 'grabbing';
      });
      
      // 滑鼠/觸控移動
      canvas.addEventListener('pointermove', (e) => {
        if (isPanning) {
          const deltaX = (e.clientX - lastPointerX) / cameraZoom;
          const deltaY = (e.clientY - lastPointerY) / cameraZoom;
          
          cameraX -= deltaX;
          cameraY -= deltaY;
          
          updateCameraTransform();
          
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;
        }
      });
      
      // 滑鼠/觸控放開
      canvas.addEventListener('pointerup', () => {
        isPanning = false;
        canvas.style.cursor = 'grab';
      });
      
      // 滑鼠滾輪縮放
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // 計算滑鼠在世界座標中的位置 (縮放前)
        const worldX = (mouseX - CANVAS_WIDTH / 2) / cameraZoom + cameraX;
        const worldY = (mouseY - CANVAS_HEIGHT / 2) / cameraZoom + cameraY;
        
        // 縮放
        const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
        cameraZoom = Math.max(0.1, Math.min(3.0, cameraZoom * zoomFactor));
        
        // 調整攝影機位置讓滑鼠位置保持不變
        cameraX = worldX - (mouseX - CANVAS_WIDTH / 2) / cameraZoom;
        cameraY = worldY - (mouseY - CANVAS_HEIGHT / 2) / cameraZoom;
        
        updateCameraTransform();
      });
      
      // 設定游標樣式
      canvas.style.cursor = 'grab';
    }
    
    // === 頁面載入完成後初始化 ===
    window.addEventListener('DOMContentLoaded', initEditor);
  </script>
</body>
</html>
