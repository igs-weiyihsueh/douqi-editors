<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡潔關卡編輯器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: white;
      overflow: hidden;
    }
    
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
    }
    
    .preview-container {
      background: #333;
      border: 2px solid #555;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    .canvas-wrapper {
      position: relative;
      background: #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      background: #2a2a2a;
    }
    
    .title {
      text-align: center;
      margin-bottom: 15px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
    }
    
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 100;
    }
    
    .controls {
      text-align: center;
      margin-top: 15px;
    }
    
    .controls button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      margin: 0 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .controls button:hover {
      background: #45a049;
    }
    
    .controls button:disabled {
      background: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="preview-container">
      <div class="title">遊戲預覽 (16:9)</div>
      
      <div class="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div class="info" id="info">
          載入中...
        </div>
      </div>
      
      <div class="controls">
        <button onclick="loadTestLevel()">載入測試關卡</button>
        <button onclick="resetView()">重置攝影機</button>
        <button onclick="toggleGrid()">切換網格</button>
        <button onclick="toggleBounds()">切換邊界</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/pixi.js@7.2.4/dist/pixi.min.js"></script>
  <script>
    // === 簡潔的全域變數 ===
    let app = null;
    let container = null;
    let entities = [];
    let showGrid = true;
    let showBounds = true;
    
    // === 遊戲場地設定 - 基於實際鬥氣割草配置 ===
    const GAME_WORLD_WIDTH = 1600;   // 實際遊戲世界寬度  
    const GAME_WORLD_HEIGHT = 1200;  // 實際遊戲世界高度
    const CANVAS_WIDTH = 960;        // Canvas顯示寬度 (16:9)
    const CANVAS_HEIGHT = 540;       // Canvas顯示高度 (16:9)
    
    // === 攝影機設定 ===
    let cameraX = 0;                 // 攝影機X位置
    let cameraY = 0;                 // 攝影機Y位置  
    let cameraZoom = 0.4;            // 攝影機縮放 (初始值讓整個場地可見)
    
    // === 初始化 PIXI ===
    function initEditor() {
      const canvas = document.getElementById('game-canvas');
      
      // 設定 Canvas 尺寸
      canvas.width = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;
      canvas.style.width = `${CANVAS_WIDTH}px`;
      canvas.style.height = `${CANVAS_HEIGHT}px`;
      
      // 創建 PIXI Application
      app = new PIXI.Application({
        view: canvas,
        width: CANVAS_WIDTH,
        height: CANVAS_HEIGHT,
        backgroundColor: 0x2a2a2a,
        antialias: true
      });
      
      // 創建主容器
      container = new PIXI.Container();
      app.stage.addChild(container);
      
      // 設定初始攝影機位置和縮放
      container.x = CANVAS_WIDTH / 2;
      container.y = CANVAS_HEIGHT / 2;
      container.scale.set(cameraZoom);
      
      // 創建背景網格
      createGrid();
      
      // 創建關卡邊界
      createLevelBounds();
      
      // 更新資訊顯示
      updateInfo();
      
      console.log('簡潔編輯器初始化完成');
      console.log(`Canvas: ${CANVAS_WIDTH}x${CANVAS_HEIGHT}`);
      console.log(`遊戲世界: ${GAME_WORLD_WIDTH}x${GAME_WORLD_HEIGHT}`);
      console.log(`攝影機位置: (${cameraX}, ${cameraY})`);
      console.log(`攝影機縮放: ${cameraZoom}`);
    }
    
    // === 創建關卡邊界顯示 ===
    function createLevelBounds() {
      const boundsContainer = new PIXI.Container();
      const graphics = new PIXI.Graphics();
      
      // 繪製關卡邊界矩形
      graphics.lineStyle(4, 0xff6b6b, 0.8); // 紅色邊界線
      graphics.drawRect(
        -GAME_WORLD_WIDTH / 2, 
        -GAME_WORLD_HEIGHT / 2, 
        GAME_WORLD_WIDTH, 
        GAME_WORLD_HEIGHT
      );
      
      // 繪製邊界角標
      const cornerSize = 50;
      graphics.lineStyle(6, 0xff6b6b, 1.0);
      
      // 左上角
      graphics.moveTo(-GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2 + cornerSize);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2 + cornerSize, -GAME_WORLD_HEIGHT / 2);
      
      // 右上角
      graphics.moveTo(GAME_WORLD_WIDTH / 2 - cornerSize, -GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(GAME_WORLD_WIDTH / 2, -GAME_WORLD_HEIGHT / 2 + cornerSize);
      
      // 右下角
      graphics.moveTo(GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2 - cornerSize);
      graphics.lineTo(GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(GAME_WORLD_WIDTH / 2 - cornerSize, GAME_WORLD_HEIGHT / 2);
      
      // 左下角
      graphics.moveTo(-GAME_WORLD_WIDTH / 2 + cornerSize, GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2);
      graphics.lineTo(-GAME_WORLD_WIDTH / 2, GAME_WORLD_HEIGHT / 2 - cornerSize);
      
      boundsContainer.addChild(graphics);
      container.addChild(boundsContainer);
      
      // 儲存邊界引用
      container.boundsContainer = boundsContainer;
      
      console.log(`關卡邊界: ${GAME_WORLD_WIDTH}x${GAME_WORLD_HEIGHT}`);
    }
    
    // === 創建背景網格 ===
    function createGrid() {
      const gridContainer = new PIXI.Container();
      const graphics = new PIXI.Graphics();
      
      // 網格設定
      const gridSize = 100;
      const gridColor = 0x444444;
      const centerColor = 0x666666;
      
      graphics.lineStyle(1, gridColor, 0.3);
      
      // 繪製網格線
      for (let x = -1000; x <= 1000; x += gridSize) {
        graphics.moveTo(x, -1000);
        graphics.lineTo(x, 1000);
      }
      
      for (let y = -1000; y <= 1000; y += gridSize) {
        graphics.moveTo(-1000, y);
        graphics.lineTo(1000, y);
      }
      
      // 繪製中心十字線
      graphics.lineStyle(2, centerColor, 0.6);
      graphics.moveTo(-50, 0);
      graphics.lineTo(50, 0);
      graphics.moveTo(0, -50);
      graphics.lineTo(0, 50);
      
      gridContainer.addChild(graphics);
      container.addChild(gridContainer);
      
      // 儲存網格引用
      container.gridContainer = gridContainer;
    }
    
    // === 載入測試關卡 ===
    function loadTestLevel() {
      // 清除舊實體
      entities.forEach(entity => {
        container.removeChild(entity);
      });
      entities = [];
      
      // 創建測試實體 - 基於test_level.json的實際座標
      const testEntities = [
        // 基於test_level.json中的實體位置 (3D轉2D: x,z座標)
        { type: 'enemy', x: 300, y: 300, color: 0xff4444, name: 'enemy_001' },   // position: [3,0,3]
        { type: 'collectible', x: 100, y: 100, color: 0x44ff44, name: 'collectible_001' }, // position: [1,1,1] 
        { type: 'powerup', x: -100, y: -100, color: 0x4444ff, name: 'powerup_001' }, // position: [-1,1,-1]
        
        // 額外測試實體展示場地範圍
        { type: 'enemy', x: -700, y: 0, color: 0xff4444, name: 'enemy_left' },
        { type: 'enemy', x: 700, y: 0, color: 0xff4444, name: 'enemy_right' },
        { type: 'collectible', x: 0, y: -500, color: 0x44ff44, name: 'item_top' },
        { type: 'collectible', x: 0, y: 500, color: 0x44ff44, name: 'item_bottom' },
        
        // 邊界附近的實體  
        { type: 'powerup', x: -750, y: -550, color: 0x4444ff, name: 'corner_tl' },
        { type: 'powerup', x: 750, y: 550, color: 0x4444ff, name: 'corner_br' }
      ];
      
      testEntities.forEach(entityData => {
        const entity = createEntity(entityData);
        entities.push(entity);
        container.addChild(entity);
      });
      
      updateInfo();
      console.log(`載入了 ${entities.length} 個測試實體`);
    }
    
    // === 創建實體 ===
    function createEntity(data) {
      const graphics = new PIXI.Graphics();
      
      // 根據類型設定大小
      let size = 10;
      switch(data.type) {
        case 'enemy': size = 14; break;
        case 'item': size = 8; break;
        case 'powerup': size = 12; break;
      }
      
      // 繪製實體
      graphics.beginFill(data.color);
      graphics.drawCircle(0, 0, size);
      graphics.endFill();
      
      // 繪製邊框
      graphics.lineStyle(2, 0xffffff, 0.8);
      graphics.drawCircle(0, 0, size);
      
      // 設定位置
      graphics.x = data.x;
      graphics.y = data.y;
      
      return graphics;
    }
    
    // === 重置視角 ===
    function resetView() {
      // 重置攝影機到中心，縮放讓整個場地可見
      cameraX = 0;
      cameraY = 0; 
      cameraZoom = 0.4;
      
      // 更新容器變換
      updateCameraTransform();
      updateInfo();
      console.log('攝影機視角已重置');
    }
    
    // === 更新攝影機變換 ===
    function updateCameraTransform() {
      // 攝影機縮放
      container.scale.set(cameraZoom);
      
      // 攝影機位置 (注意：容器位移方向與攝影機移動方向相反)
      container.x = CANVAS_WIDTH / 2 - cameraX * cameraZoom;
      container.y = CANVAS_HEIGHT / 2 - cameraY * cameraZoom;
    }
    
    // === 切換邊界顯示 ===
    function toggleBounds() {
      showBounds = !showBounds;
      if (container.boundsContainer) {
        container.boundsContainer.visible = showBounds;
      }
      updateInfo();
    }
    
    // === 切換網格顯示 ===
    function toggleGrid() {
      showGrid = !showGrid;
      if (container.gridContainer) {
        container.gridContainer.visible = showGrid;
      }
      updateInfo();
    }
    
    // === 更新資訊顯示 ===
    function updateInfo() {
      const info = document.getElementById('info');
      info.innerHTML = `
        Canvas: ${CANVAS_WIDTH}×${CANVAS_HEIGHT}<br>
        遊戲世界: ${GAME_WORLD_WIDTH}×${GAME_WORLD_HEIGHT}<br>
        攝影機: (${cameraX.toFixed(0)}, ${cameraY.toFixed(0)})<br>
        縮放: ${cameraZoom.toFixed(2)}x<br>
        實體: ${entities.length}<br>
        網格: ${showGrid ? '顯示' : '隱藏'}<br>
        邊界: ${showBounds ? '顯示' : '隱藏'}
      `;
    }
    
    // === 滑鼠交互 ===
    function setupInteraction() {
      const canvas = document.getElementById('game-canvas');
      let isDragging = false;
      let lastPos = { x: 0, y: 0 };
      
      // 滑鼠滾輪縮放 (攝影機縮放)
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        
        // 獲取滑鼠在Canvas中的位置
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left - CANVAS_WIDTH / 2;
        const mouseY = e.clientY - rect.top - CANVAS_HEIGHT / 2;
        
        // 計算世界座標中的滑鼠位置
        const worldX = cameraX + mouseX / cameraZoom;
        const worldY = cameraY + mouseY / cameraZoom;
        
        // 縮放
        const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
        const newZoom = Math.max(0.1, Math.min(3.0, cameraZoom * zoomFactor));
        
        // 調整攝影機位置使縮放中心保持在滑鼠位置
        cameraX = worldX - mouseX / newZoom;
        cameraY = worldY - mouseY / newZoom;
        cameraZoom = newZoom;
        
        updateCameraTransform();
        updateInfo();
      });
      
      // 滑鼠拖拽平移 (攝影機移動)
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastPos.x = e.clientX;
        lastPos.y = e.clientY;
        canvas.style.cursor = 'grabbing';
      });
      
      canvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const deltaX = e.clientX - lastPos.x;
          const deltaY = e.clientY - lastPos.y;
          
          // 移動攝影機 (注意方向相反)
          cameraX -= deltaX / cameraZoom;
          cameraY -= deltaY / cameraZoom;
          
          lastPos.x = e.clientX;
          lastPos.y = e.clientY;
          
          updateCameraTransform();
          updateInfo();
        }
      });
      
      canvas.addEventListener('mouseup', () => {
        isDragging = false;
        canvas.style.cursor = 'grab';
      });
      
      canvas.addEventListener('mouseleave', () => {
        isDragging = false;
        canvas.style.cursor = 'default';
      });
      
      canvas.style.cursor = 'grab';
    }
    
    // === 啟動編輯器 ===
    window.addEventListener('load', () => {
      initEditor();
      setupInteraction();
      loadTestLevel();
    });
  </script>
</body>
</html>
