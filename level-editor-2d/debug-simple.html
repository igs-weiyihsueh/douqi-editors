<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>預覽問題診斷</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #000; }
    .container { display: flex; height: 100vh; }
    .left { width: 320px; background: #16213e; color: white; padding: 20px; }
    .center { 
      flex: 1; 
      background: #111; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      position: relative;
    }
    .right { width: 280px; background: #16213e; color: white; padding: 20px; }
    
    #game-preview {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ff0000; /* 紅色邊框標示容器 */
    }
    
    canvas {
      background: #2a2a2a;
      border: 2px solid #00ff00; /* 綠色邊框標示Canvas */
      display: block;
      margin: 0;
    }
    
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
    }
    
    .controls {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
    }
    
    button {
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: white;
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h3>左側面板</h3>
      <p>選擇關卡：</p>
      <select id="level-selector">
        <option value="">選擇關卡...</option>
        <option value="test_level">📚 新手教學</option>
      </select>
    </div>
    
    <div class="center">
      <div id="game-preview">
        <canvas id="game-canvas" width="800" height="450">Canvas not supported</canvas>
      </div>
      
      <div class="info" id="info">
        載入中...
      </div>
      
      <div class="controls">
        <button onclick="resetView()">重置</button>
        <button onclick="zoomIn()">放大</button>
        <button onclick="zoomOut()">縮小</button>
        <div>狀態: <span id="status">初始化中...</span></div>
      </div>
    </div>
    
    <div class="right">
      <h3>右側面板</h3>
      <p>診斷資訊:</p>
      <div id="debug-info">
        等待初始化...
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/pixi.js@7.2.4/dist/pixi.min.js"></script>
  <script>
    let app, container, scale = 0.8, posX = 400, posY = 225;
    
    function updateInfo() {
      const canvas = document.getElementById('game-canvas');
      const gamePreview = document.getElementById('game-preview');
      const info = document.getElementById('info');
      const debugInfo = document.getElementById('debug-info');
      
      const canvasRect = canvas.getBoundingClientRect();
      const containerRect = gamePreview.getBoundingClientRect();
      
      info.innerHTML = `
        Canvas: ${canvas.width}×${canvas.height}<br>
        Container: ${containerRect.width}×${containerRect.height}<br>
        Canvas顯示: ${canvasRect.width}×${canvasRect.height}<br>
        位置: ${canvasRect.left-containerRect.left}, ${canvasRect.top-containerRect.top}
      `;
      
      debugInfo.innerHTML = `
        PIXI位置: ${container ? container.x.toFixed(1) : 'N/A'}, ${container ? container.y.toFixed(1) : 'N/A'}<br>
        PIXI縮放: ${container ? container.scale.x.toFixed(2) : 'N/A'}<br>
        目標位置: ${posX}, ${posY}<br>
        目標縮放: ${scale}
      `;
    }
    
    function initPixi() {
      const canvas = document.getElementById('game-canvas');
      
      try {
        app = new PIXI.Application({
          view: canvas,
          width: 800,
          height: 450,
          backgroundColor: 0x2a2a2a
        });
        
        container = new PIXI.Container();
        app.stage.addChild(container);
        
        // 設置初始位置
        container.x = posX;
        container.y = posY;
        container.scale.set(scale);
        
        // 創建測試實體
        createTestEntities();
        
        document.getElementById('status').textContent = '初始化完成';
        console.log('PIXI初始化成功');
        
      } catch (error) {
        document.getElementById('status').textContent = '初始化失敗: ' + error.message;
        console.error('PIXI初始化失敗:', error);
      }
      
      updateInfo();
      setInterval(updateInfo, 1000);
    }
    
    function createTestEntities() {
      if (!container) return;
      
      // 創建測試實體
      const enemy = new PIXI.Graphics();
      enemy.beginFill(0xff4444);
      enemy.drawCircle(0, 0, 14);
      enemy.endFill();
      enemy.x = 3;
      enemy.y = -3;
      container.addChild(enemy);
      
      const item = new PIXI.Graphics();
      item.beginFill(0x44ffff);
      item.drawCircle(0, 0, 8);
      item.endFill();
      item.x = 1;
      item.y = -1;
      container.addChild(item);
      
      const powerup = new PIXI.Graphics();
      powerup.beginFill(0xff8844);
      powerup.drawPolygon([0,-12, 8,-4, 8,4, 0,12, -8,4, -8,-4]);
      powerup.endFill();
      powerup.x = -1;
      powerup.y = 1;
      container.addChild(powerup);
      
      console.log('測試實體已創建');
    }
    
    function resetView() {
      if (container) {
        container.x = posX = 400;
        container.y = posY = 225;
        container.scale.set(scale = 0.8);
        updateInfo();
        console.log('視角已重置');
      }
    }
    
    function zoomIn() {
      if (container) {
        scale = Math.min(5.0, scale + 0.2);
        container.scale.set(scale);
        updateInfo();
        console.log('放大到:', scale);
      }
    }
    
    function zoomOut() {
      if (container) {
        scale = Math.max(0.1, scale - 0.2);
        container.scale.set(scale);
        updateInfo();
        console.log('縮小到:', scale);
      }
    }
    
    // 初始化
    document.addEventListener('DOMContentLoaded', initPixi);
    
    // 關卡選擇
    document.getElementById('level-selector').addEventListener('change', (e) => {
      if (e.target.value === 'test_level') {
        document.getElementById('status').textContent = '載入測試關卡';
        createTestEntities();
      }
    });
  </script>
</body>
</html>
